[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-reading-agent"
version = "0.3.0"
description = "Evidence-grounded paper analysis and AMP-style poster skills"
requires-python = ">=3.10"
dependencies = [
  "pypdfium2>=4.30",
  "Pillow>=11.0",
]

[project.optional-dependencies]
validation = ["jsonschema>=4.23"]
dev = ["pytest>=8.0"]

[project.scripts]
paper-reader = "paperposter.pipeline:main"
paper-deliverables = "paperposter.deliverables:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

