    <g transform="translate(515 95)"><rect width="145" height="170" rx="20" fill="#F3E8FF" stroke="#D8B4FE"/><circle cx="72" cy="43" r="27" fill="#A855F7"/><rect x="56" y="28" width="32" height="30" rx="5" fill="none" stroke="#fff" stroke-width="4"/><path d="M61 48l7-7 6 5 8-12" fill="none" stroke="#fff" stroke-width="3"/><text x="72" y="98" text-anchor="middle" fill="#0F172A" font-size="18" font-weight="800">Assets</text><text x="72" y="126" text-anchor="middle" fill="#475569" font-size="13">Figure, table,</text><text x="72" y="145" text-anchor="middle" fill="#475569" font-size="13">equation selection</text></g>
