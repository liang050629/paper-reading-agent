    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#F8FAFC"/>
  <path d="M90 180 H1110" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.45"/>
