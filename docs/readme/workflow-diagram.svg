<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Paper Reading Agent workflow</title>
  <desc id="desc">A seven-stage workflow from PDF ingestion to evidence analysis, asset selection, poster and report generation, quality assurance, and final deliverables.</desc>
  <defs>
